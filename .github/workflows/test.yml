name: Python checks
on:
  push:
    branches: [main, feat/docker-tvdb-provider]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py tests
      - run: CACHE_DB=/tmp/plex-tvdb-ci.sqlite3 python -m unittest discover -s tests -v
